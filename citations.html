<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDIKOI · Citations</title>
    <link rel="icon" href="data/photos/default.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800&display=swap">
    <style>
        :root {
            --bleu: #002395;
            --encre: #0A1A4F;
            --rouge: #C1121F;
            --papier: #F7F5F0;
            --blanc: #FFFFFF;
            --gris: #4A5578;
            --titre: 'Anton', Impact, 'Arial Narrow', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--papier);
            font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--encre);
            min-height: 100vh;
        }

        body::before {
            content: '';
            display: block;
            height: 10px;
            background: linear-gradient(to right, var(--bleu) 0 33.33%, var(--blanc) 33.33% 66.66%, var(--rouge) 66.66%);
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 28px 16px 60px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        h1 {
            font-family: var(--titre);
            font-weight: 400;
            font-size: 2.6rem;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        h1 span { color: var(--bleu); }

        .back-link {
            color: var(--encre);
            font-weight: 800;
            text-decoration: none;
            border: 2px solid var(--encre);
            padding: 8px 14px;
            white-space: nowrap;
        }
        .back-link:hover { background: var(--encre); color: var(--blanc); }

        /* Filters */
        .filters {
            position: sticky;
            top: 0;
            z-index: 1;
            background: var(--papier);
            padding: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 3px solid var(--encre);
        }

        .filters input[type="search"],
        .filters select {
            font: inherit;
            font-weight: 500;
            color: var(--encre);
            background: var(--blanc);
            border: 2px solid var(--encre);
            border-radius: 0;
            padding: 10px 12px;
        }
        .filters input[type="search"] { flex: 1 1 260px; min-width: 0; }
        .filters select { flex: 1 1 200px; min-width: 0; }
        .filters input[type="search"]::placeholder { color: var(--gris); }
        .filters input:focus, .filters select:focus { outline: 3px solid var(--rouge); outline-offset: 1px; }

        .filters label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        input[type="checkbox"] { accent-color: var(--bleu); width: 16px; height: 16px; }

        .count { color: var(--gris); font-weight: 700; font-size: 0.9rem; margin: 12px 0 16px; }

        /* Quote cards */
        .quote-list { display: flex; flex-direction: column; gap: 14px; }

        .quote-card {
            background: var(--blanc);
            border: 3px solid var(--encre);
            padding: 16px;
            display: grid;
            grid-template-columns: 56px 1fr;
            gap: 14px;
        }

        .quote-card img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 25%;
            background: #D7DDF0;
        }

        .quote-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 10px;
            margin-bottom: 8px;
        }
        .quote-author {
            font-family: var(--titre);
            font-weight: 400;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quote-date { color: var(--gris); font-size: 0.85rem; font-weight: 700; }
        .quote-tag {
            background: var(--encre);
            color: var(--blanc);
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
        }

        .quote-text { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }

        .quote-card details { margin-top: 10px; color: var(--gris); font-size: 0.95rem; line-height: 1.45; }
        .quote-card summary { cursor: pointer; color: var(--bleu); font-weight: 800; }
        .quote-card details p { margin-top: 6px; }

        .quote-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #DCDDE6;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .quote-source { overflow-wrap: anywhere; }
        .quote-source a { color: var(--bleu); }
        .quote-source a:hover { color: var(--rouge); }
        .quote-source .missing { color: var(--rouge); }

        .remove-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gris);
            cursor: pointer;
        }

        .quote-card.to-remove { opacity: 0.55; border-color: var(--rouge); }
        .quote-card.to-remove .remove-toggle { color: var(--rouge); }

        /* Removal bar */
        .removal-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            background: #FBE7E8;
            border: 3px solid var(--rouge);
            padding: 12px;
            margin-top: 12px;
        }
        .removal-bar[hidden] { display: none; }
        .removal-bar span { font-family: var(--titre); font-size: 1.2rem; text-transform: uppercase; margin-right: auto; }
        .removal-bar button {
            font: inherit;
            font-weight: 800;
            color: var(--blanc);
            background: var(--rouge);
            border: none;
            padding: 10px 14px;
            cursor: pointer;
        }
        .removal-bar button.secondary { background: transparent; color: var(--encre); border: 2px solid var(--encre); }
        .removal-help { flex-basis: 100%; color: var(--encre); font-size: 0.85rem; }

        .empty { color: var(--gris); text-align: center; padding: 40px 0; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1><span>KIDIKOI</span><br>Les citations</h1>
            <a class="back-link" href="index.html">← Jeu</a>
        </div>

        <div class="filters">
            <input type="search" id="search" placeholder="Rechercher un mot, un nom…" aria-label="Rechercher">
            <select id="corpus" aria-label="Filtrer par corpus">
                <option value="">Toutes les citations</option>
                <option value="2027">Présidentielle 2027</option>
                <option value="politiques">Tous les politiques</option>
                <option value="fiction">Fiction</option>
            </select>
            <select id="person" aria-label="Filtrer par personne">
                <option value="">Tout le monde</option>
            </select>
            <label><input type="checkbox" id="no-source"> Sans source uniquement</label>
            <label><input type="checkbox" id="only-removed"> À retirer uniquement</label>
        </div>

        <div class="removal-bar" id="removal-bar" hidden>
            <span id="removal-count"></span>
            <button type="button" id="download-cleaned">Télécharger les CSV sans ces citations</button>
            <button type="button" id="clear-removals" class="secondary">Tout décocher</button>
            <p class="removal-help">Remplace ensuite les fichiers du dossier <code>data/spreadsheet/</code> par ceux téléchargés. Les cases cochées sont mémorisées dans ce navigateur uniquement.</p>
        </div>

        <p class="count" id="count">Chargement…</p>
        <div class="quote-list" id="quote-list"></div>
    </div>

    <script src="csv.js"></script>
    <script src="citations.js"></script>
</body>
</html>
