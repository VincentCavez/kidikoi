<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDIKOI · Citations</title>
    <link rel="icon" href="data/photos/default.jpg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #1a1a2d;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 32px 16px 60px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
        }

        h1 { font-size: 1.8rem; letter-spacing: 1px; }
        h1 span { color: #E28413; }

        .back-link {
            color: #B8C5CB;
            text-decoration: none;
            border: 2px solid #4A8D96;
            border-radius: 10px;
            padding: 8px 14px;
            white-space: nowrap;
        }
        .back-link:hover { background: #2A4D56; color: white; }

        /* Filters */
        .filters {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #1a1a2d;
            padding: 12px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filters input[type="search"],
        .filters select {
            font: inherit;
            color: white;
            background: #2A4D56;
            border: 2px solid #4A8D96;
            border-radius: 10px;
            padding: 10px 12px;
        }
        .filters input[type="search"] { flex: 1 1 260px; min-width: 0; }
        .filters select { flex: 0 1 220px; min-width: 0; }
        .filters input[type="search"]::placeholder { color: #B8C5CB; }
        .filters input:focus, .filters select:focus { outline: none; border-color: #E28413; }

        .filters label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #B8C5CB;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .count { color: #B8C5CB; font-size: 0.9rem; margin: 6px 0 16px; }

        /* Quote cards */
        .quote-list { display: flex; flex-direction: column; gap: 14px; }

        .quote-card {
            background: linear-gradient(135deg, #2A4D56 0%, #1E3940 100%);
            border-radius: 14px;
            padding: 16px;
            display: grid;
            grid-template-columns: 56px 1fr;
            gap: 14px;
        }

        .quote-card img {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background: #1a1a2d;
        }

        .quote-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px 10px;
            margin-bottom: 6px;
        }
        .quote-author { font-weight: 600; }
        .quote-date, .quote-tag { color: #B8C5CB; font-size: 0.85rem; }
        .quote-tag {
            border: 1px solid #4A8D96;
            border-radius: 6px;
            padding: 0 6px;
        }

        .quote-text { font-size: 1.1rem; font-style: italic; line-height: 1.4; }

        .quote-card details { margin-top: 10px; color: #B8C5CB; font-size: 0.95rem; line-height: 1.45; }
        .quote-card summary { cursor: pointer; color: #E28413; }
        .quote-card details p { margin-top: 6px; }

        .quote-source { margin-top: 10px; font-size: 0.9rem; overflow-wrap: anywhere; }
        .quote-source a { color: #6ee600; }
        .quote-source .missing { color: #DE5A3C; }

        .empty { color: #B8C5CB; text-align: center; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-row">
            <h1><span>KIDIKOI</span> · Citations</h1>
            <a class="back-link" href="index.html">← Jeu</a>
        </div>

        <div class="filters">
            <input type="search" id="search" placeholder="Rechercher un mot, un nom…" aria-label="Rechercher">
            <select id="person" aria-label="Filtrer par personne">
                <option value="">Tout le monde</option>
            </select>
            <label><input type="checkbox" id="no-source"> Sans source uniquement</label>
        </div>

        <p class="count" id="count">Chargement…</p>
        <div class="quote-list" id="quote-list"></div>
    </div>

    <script src="csv.js"></script>
    <script src="citations.js"></script>
</body>
</html>
